# Progressive symbol map for Super Ghouls N Ghosts.
#
# Each [[func]] names an address the analyzer should treat as a function.
# Set emit = true to promote one into ahead-of-time codegen; leave it false
# to keep it interpreted. tools/regen.sh syncs labels and tier choices into
# each recomp/bankNN.cfg; only emit=true adds a func/funcs.h declaration.
# Do not hand-edit the generated blocks in the bank configs.

[[func]]
name = "I_RESET"
addr = "8108"
bank = 0
emit = false
note = "Emulation RESET vector ($FFFC)"

[[func]]
name = "I_NMI"
addr = "81f7"
bank = 0
emit = false
note = "Native NMI vector ($FFEA)"

# --- Hand-written: task system (coroutines) -------------------------------
# These routines switch the guest stack (TCS) and resume tasks with RTL from
# another stack. Static code cannot express that, so they stay interpreted.
# Found by tools/bisect_aot.py: AOT current_task_suspend hangs Level 1.

[[func]]
name = "current_task_remove"
addr = "a717"
bank = 1
emit = false
note = "TCS to scheduler stack + jmp run_tasks; keep LLE"

[[func]]
name = "current_task_suspend"
addr = "a728"
bank = 1
emit = false
note = "saves regs on task stack, TCS switch; AOT breaks resume (bisected)"

